<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的阅读器</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-left">
      <button id="toggle-nav" class="icon-btn" title="目录">☰</button>
      <select id="book-select" title="切换书籍"></select>
      <button id="delete-book" class="icon-btn danger" title="删除当前书籍" disabled>🗑</button>
      <select id="chapter-select"></select>
    </div>
    <div class="toolbar-center">
      <div class="view-switch">
        <button data-view="zh">中文</button>
        <button data-view="en">English</button>
        <button data-view="both" class="active">对照</button>
      </div>
    </div>
    <div class="toolbar-right">
      <button id="font-dec" class="icon-btn" title="减小字号">A-</button>
      <button id="font-inc" class="icon-btn" title="增大字号">A+</button>
      <button id="theme-toggle" class="icon-btn" title="切换主题">🌓</button>
      <button id="upload-book" class="icon-btn" title="上传书籍">📚+</button>
      <button id="toggle-notes" class="icon-btn" title="笔记">📝</button>
    </div>
    <div id="reading-progress" class="reading-progress">
      <div id="reading-progress-bar" class="reading-progress-bar"></div>
    </div>
  </header>

  <main class="layout">
    <aside id="nav-panel" class="nav-panel">
      <div class="nav-title">目录</div>
      <ul id="toc-list"></ul>
    </aside>
    <section class="content">
      <div class="pane" id="pane-zh"><article class="markdown-body"></article></div>
      <div class="pane" id="pane-en"><article class="markdown-body"></article></div>
    </section>
    <aside id="notes-panel" class="notes-panel hidden">
      <div class="notes-header">
        <span>笔记</span>
        <div class="notes-header-actions">
          <label class="select-all-label" title="全选当前筛选">
            <input type="checkbox" id="select-all-notes"><span>全选</span>
          </label>
          <button id="batch-delete-notes" class="icon-btn danger" title="删除选中" disabled>🗑</button>
          <button id="export-notes" class="icon-btn" title="导出">⬇</button>
          <button id="import-notes-btn" class="icon-btn" title="导入">⬆</button>
          <input type="file" id="import-notes-input" accept=".json" hidden>
          <button id="close-notes" class="icon-btn">✕</button>
        </div>
      </div>
      <div id="tag-filter" class="tag-filter"></div>
      <ul id="notes-list"></ul>
    </aside>
  </main>

  <div id="selection-toolbar" class="selection-toolbar hidden">
    <button data-action="highlight">高亮</button>
    <button data-action="note">记笔记</button>
  </div>

  <div id="note-dialog" class="modal hidden">
    <div class="modal-content">
      <div class="modal-title">添加笔记</div>
      <blockquote id="note-quote" class="note-quote"></blockquote>
      <div class="tag-editor" id="note-tags-editor"></div>
      <input type="text" id="note-tag-input" placeholder="输入标签后按回车添加">
      <div id="note-tag-suggestions" class="tag-suggestions"></div>
      <textarea id="note-input" placeholder="写下你的想法..."></textarea>
      <div class="modal-actions">
        <button id="note-cancel">取消</button>
        <button id="note-save" class="primary">保存</button>
      </div>
    </div>
  </div>

<div id="upload-dialog" class="modal hidden">
  <div class="modal-content" style="max-width: 920px;">
    <div class="modal-title">上传书籍</div>
    <p class="upload-hint">
      · <strong>zip 文件</strong>：把书籍文件夹压缩成 zip 后上传<br>
      · <strong>选择文件夹</strong>：直接选中包含 <code>zh/</code> 和 <code>en/</code> 子目录的文件夹<br>
      如已有 <code>manifest.json</code> 会直接使用，没有则自动根据 zh/ en/ 目录生成。<br>
      <strong>生成结果可在下方表格中直接修改</strong>，也能点「导出 manifest.json」下载检查。
    </p>
    <div class="upload-source">
      <label class="upload-btn">
        <input type="file" id="upload-zip-input" accept=".zip" hidden>
        📦 选择 zip 文件
      </label>
      <label class="upload-btn">
        <input type="file" id="upload-folder-input" webkitdirectory directory multiple hidden>
        📁 选择文件夹
      </label>
    </div>
    <div id="upload-status" class="upload-status"></div>
    <div id="upload-preview" class="upload-preview"></div>
    <div id="upload-title-wrap" style="display: none;">
      <label>书名：</label>
      <input type="text" id="upload-title" placeholder="书籍名称">
    </div>
    <div class="modal-actions">
      <button id="upload-export" class="icon-btn" style="margin-right: auto;" disabled>⬇ 导出 manifest.json</button>
      <button id="upload-cancel">取消</button>
      <button id="upload-confirm" class="primary" disabled>导入</button>
    </div>
  </div>
</div>

  <script src="app.js"></script>
</body>
</html>
